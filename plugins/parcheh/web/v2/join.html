<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Join the project · parcheh</title>
  <style>
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body {
      margin: 0; min-height: 100svh; padding: 24px; display: grid; place-items: center;
      background: radial-gradient(ellipse at 12% 0%, #dceee4, transparent 65%),
        radial-gradient(ellipse at 96% 92%, #e4e0f2, transparent 58%), #f1f2ed;
      color: #172a25; font: 15px/1.5 system-ui, sans-serif;
    }
    #preview {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      opacity: .34; filter: blur(12px); transform: scale(1.04); pointer-events: none;
    }
    main {
      position: relative; width: min(100%, 470px); padding: clamp(21px, 6vw, 36px);
      background: #fff; border: 1px solid #dce5de; border-radius: 22px;
      box-shadow: 0 20px 65px #153b2320;
    }
    .brand { display: flex; gap: 8px; align-items: center; color: #2b5549; font-weight: 700; }
    h1 { margin: 15px 0 3px; font-size: clamp(28px, 7vw, 38px); line-height: 1.15; letter-spacing: -.04em; }
    p { margin: 0; }
    .quiet { color: #4c625a; }
    #flow { margin-top: 22px; }
    .options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .option {
      height: 100%; min-height: 75px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px; padding: 7px 2px; text-align: center;
      font-size: clamp(.71rem, 3.35vw, .85rem); font-weight: 650; line-height: 1.15;
      border: 1px solid #d1ddd5; border-radius: 11px; background: #fff; color: inherit;
    }
    .option:hover { border-color: #536e61; }
    .option[aria-pressed=true] { background: #e8f3ed; border-color: #326553; box-shadow: inset 0 0 0 1px #326553; }
    :is(button, textarea):focus-visible { outline: 2px solid #235b99; outline-offset: 2px; }
    .mark { flex: none; width: 26px; height: 26px; }
    #prompt { margin-top: 16px; }
    textarea {
      width: 100%; display: block; margin-top: 8px; min-height: 8em; resize: vertical;
      padding: 9px 11px; border: 1px solid #bbcfc2; border-radius: 9px;
      font: inherit; color: inherit; background: #fff;
    }
    button { cursor: pointer; }
    .action {
      display: block; width: 100%; margin-top: 8px; padding: 10px 14px;
      border: 1px solid transparent; border-radius: 9px;
      background: #225645; color: #fff; font: inherit; font-weight: 650;
    }
    .action:hover { background: #163e31; }
    #status { margin-top: 6px; }
    #status:empty, #message:empty { display: none; }
    @media (max-width: 360px) {
      body { padding: 12px; }
      .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <script type="module" src="/join.js"></script>
</head>
<body>
  <img id="preview" alt="" hidden>
  <main>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <path d="m10 14 4-4m-6 3-1.5 1.5a3.5 3.5 0 0 0 5 5L15 16m1-5 1.5-1.5a3.5 3.5 0 0 0-5-5L9 8"/>
      </svg>
      parcheh
    </div>
    <h1>What coding agent do you want to use for the session?</h1>
    <p class="quiet" id="message"></p>
    <noscript>Open the invitation in a browser with JavaScript enabled.</noscript>
    <div id="flow" hidden>
      <div class="options">
        <button class="option" type="button" disabled data-client="codex">
          <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
            <path fill="#4943ae" d="M9.4 24a6 6 0 0 1-5.1-9.2 6.5 6.5 0 0 1 8.5-9.2 6.6 6.6 0 0 1 10 4.6 6.6 6.6 0 0 1-3 12.6 6.1 6.1 0 0 1-10.4 1.2Z"/>
            <path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="m9.1 11.5 3.4 3-3.4 3m6.4 0h4"/>
          </svg>
          Codex
        </button>
        <button class="option" type="button" disabled data-client="claude-code">
          <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#a64b31" stroke-width="2.2" stroke-linecap="round">
            <path d="m14 3-.4 22M4.1 8.5l19.7 11.2M4.4 19.8l19.2-12M9 4.5l10.1 19M8.8 24 19.5 4.4M3 14.9l22-.9"/>
          </svg>
          Claude Code
        </button>
        <button class="option" type="button" disabled data-client="antigravity">
          <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
            <defs>
              <linearGradient id="arc" x2="100%" y2="0%">
                <stop stop-color="#147c56"/><stop offset=".35" stop-color="#315cb1"/>
                <stop offset=".63" stop-color="#763bc1"/><stop offset="1" stop-color="#be493a"/>
              </linearGradient>
            </defs>
            <path d="M4.3 20.4C7.4 15.8 9.9 8 14 8s6.6 7.8 9.7 12.4" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round"/>
          </svg>
          Antigravity
        </button>
        <button class="option" type="button" disabled data-client="other" aria-pressed="false" aria-controls="prompt">
          <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#456159" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 7h18v14H5zM9 11l3 3-3 3m6 0h4"/>
          </svg>
          Other
        </button>
      </div>
      <div id="prompt" hidden>
        <p class="quiet">Paste this prompt into your coding agent.</p>
        <textarea id="manual" readonly aria-label="Join prompt"></textarea>
        <button class="action" id="copy" type="button">Copy prompt</button>
      </div>
      <p id="status" role="status" class="quiet"></p>
    </div>
  </main>
</body>
</html>
