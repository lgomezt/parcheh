<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Join the project · parcheh</title>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      src: url("/invite-brand/instrument-sans.ttf") format("truetype");
      font-weight: 400 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      --paper: #fdf4e5;
      --ink: #262523;
      --blue: #32688c;
      --apricot: #da9462;
      --border: #d8bd9d;
      margin: 0; min-height: 100svh; padding: 22px; display: grid; place-items: center;
      background: var(--apricot); color: var(--ink);
      font: 14px/1.4 "Instrument Sans", system-ui, sans-serif;
    }
    #preview {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      filter: blur(9px); opacity: .32; transform: scale(1.06); pointer-events: none;
    }
    main {
      position: relative; width: min(100%, 414px); overflow: hidden;
      background: var(--paper); border: 1px solid #58392142; border-radius: 17px;
      box-shadow: 0 14px 34px #39221633;
    }
    .paint {
      height: 12px;
      background: var(--apricot) url("/invite-brand/paint.jpg") center 54% / 100% auto no-repeat;
    }
    .card-body { padding: clamp(18px, 5vw, 30px); }
    .brand {
      display: flex; align-items: center; gap: 8px; margin-bottom: 19px;
      font-size: 26px; line-height: 1; font-weight: 700; letter-spacing: -.064em;
    }
    .brand img { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: clamp(22px, 4.5vw, 30px); line-height: 1.1; letter-spacing: -.037em; }
    p { margin: 0; }
    .quiet { color: #544331; }
    #message:not(:empty) { margin-top: 12px; }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
    .option {
      display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 49px;
      padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px;
      background: #fffbf4; color: inherit; text-align: left;
      font: 600 14px/1.15 "Instrument Sans", system-ui, sans-serif;
    }
    .option:hover:enabled { border-color: var(--blue); }
    .option[aria-pressed=true] {
      border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: #e4ebec;
    }
    button:enabled { cursor: pointer; }
    button:disabled { opacity: .65; }
    :is(button, textarea):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .mark { width: 20px; height: 20px; flex: none; }
    #prompt { margin-top: 16px; }
    textarea {
      width: 100%; display: block; margin-top: 8px; min-height: 8em; resize: vertical;
      padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; color: inherit; background: #fffbf4;
    }
    input[type="email"] {
      width: 100%; display: block; margin-top: 6px; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: 8px;
      font: inherit; color: inherit; background: #fffbf4;
    }
    :is(button, textarea, input):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .action {
      display: block; width: 100%; margin-top: 8px; padding: 10px 14px;
      border: 0; border-radius: 8px; background: var(--blue); color: #fff; font: inherit; font-weight: 600;
    }
    .action:hover:enabled { background: #285675; }
    .feedback { min-height: 2.5em; margin-top: 12px; font-size: 13px; line-height: 1.25; }
    .feedback:has(#status:not(:empty)) .guidance,
    #prompt:not([hidden]) ~ .feedback .guidance { display: none; }
    @media (max-width: 390px) {
      .options { grid-template-columns: 1fr; }
    }
  </style>
  <script type="module" src="/join.js"></script>
</head>
<body>
  <img id="preview" alt="" hidden>
  <main>
    <div class="paint" aria-hidden="true"></div>
    <div class="card-body">
      <div class="brand"><img src="/invite-brand/mark.png" alt="">parcheh</div>
      <h1>Choose your coding agent</h1>
      <p class="quiet" id="message"></p>
      <noscript>Open the invitation in a browser with JavaScript enabled.</noscript>
      <div id="flow" hidden>
        <div id="email-gate" hidden style="margin-top: 14px; margin-bottom: 8px;">
          <label for="guest-email" class="quiet">Enter your email to join right away</label>
          <input type="email" id="guest-email" placeholder="you@example.com" autocomplete="email">
          <p class="quiet" id="email-hint" style="margin-top: 4px; font-size: 12px;"></p>
        </div>
        <div class="options" role="group" aria-label="Coding agents">
          <button class="option" type="button" disabled data-client="codex" aria-pressed="false">
            <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
              <path fill="#4943ae" d="M9.4 24a6 6 0 0 1-5.1-9.2 6.5 6.5 0 0 1 8.5-9.2 6.6 6.6 0 0 1 10 4.6 6.6 6.6 0 0 1-3 12.6 6.1 6.1 0 0 1-10.4 1.2Z"/>
              <path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="m9.1 11.5 3.4 3-3.4 3m6.4 0h4"/>
            </svg>
            Codex
          </button>
          <button class="option" type="button" disabled data-client="claude-code" aria-pressed="false">
            <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#a64b31" stroke-width="2.2" stroke-linecap="round">
              <path d="m14 3-.4 22M4.1 8.5l19.7 11.2M4.4 19.8l19.2-12M9 4.5l10.1 19M8.8 24 19.5 4.4M3 14.9l22-.9"/>
            </svg>
            Claude Code
          </button>
          <button class="option" type="button" disabled data-client="antigravity" aria-pressed="false">
            <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
              <defs>
                <linearGradient id="arc" x2="100%" y2="0%">
                  <stop stop-color="#147c56"/><stop offset=".35" stop-color="#315cb1"/>
                  <stop offset=".63" stop-color="#763bc1"/><stop offset="1" stop-color="#be493a"/>
                </linearGradient>
              </defs>
              <path d="M4.3 20.4C7.4 15.8 9.9 8 14 8s6.6 7.8 9.7 12.4" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round"/>
            </svg>
            Antigravity
          </button>
          <button class="option" type="button" disabled data-client="other" aria-pressed="false" aria-controls="prompt">
            <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#456159" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7h18v14H5zM9 11l3 3-3 3m6 0h4"/>
            </svg>
            Other
          </button>
        </div>
        <div id="prompt" hidden>
          <p class="quiet">Paste this prompt into your coding agent.</p>
          <textarea id="manual" readonly aria-label="Join prompt"></textarea>
          <button class="action" id="copy" type="button">Copy prompt</button>
        </div>
        <div id="claim-section" hidden style="margin-top: 14px;">
          <label for="claim-email" class="quiet">Save your edits to your email (optional)</label>
          <input type="email" id="claim-email" placeholder="you@example.com" autocomplete="email">
          <p id="claim-status" class="quiet" style="margin-top: 4px; font-size: 12px;"></p>
        </div>
        <div class="feedback quiet">
          <p class="guidance">After you join, this tab will show the shared project.</p>
          <p id="status" role="status"></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
